version: 2

sources:
  - name: raw
    schema: Olist
    tables:

      - name: customers
        identifier: olist_customers_dataset
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null

      - name: geolocation
        identifier: olist_geolocation_dataset

      - name: sellers
        identifier: olist_sellers_dataset
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null

      - name: orders
        identifier: olist_orders_dataset
        columns:
          - name: order_id
            tests:
              - unique
              - not_null

      - name: order_items
        identifier: olist_order_items_dataset
        columns:
          - name: order_id
            tests:
              - not_null
          - name: order_item_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: seller_id
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - order_id
                - order_item_id

      - name: order_reviews
        identifier: olist_order_reviews_dataset
        columns:
          - name: review_id
            tests:
              - not_null
          - name: order_id
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - review_id
                - order_id

      - name: order_payments
        identifier: olist_order_payments_dataset
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_sequential
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - order_id
                - payment_sequential

      - name: products
        identifier: olist_products_dataset
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: product_category_translations
        identifier: olist_product_category_name_translation
